name: Notificar Merge a Develop y Actualizar Roadmap

on:
  push:
    branches:
      - develop
  # (Opcional) Si también querés que avise cuando cierran o reabren una issue a mano:
  issues:
    types: [closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Tu paso actual (se ejecuta solo cuando hay push a develop)
      - name: Crear issue de notificación
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔀 Merge a develop por ${context.actor}`,
              body: `Se hizo push/merge a **develop**.\n\n**Autor:** ${context.actor}\n**Commit:** ${context.sha}\n**Mensaje:** ${context.payload.head_commit.message}\n\ncc @AylenBL8 @candebar @mikefink22 @PedroGonzalez1212 @virginia-garcia`
            })

      # 👉 NUEVO PASO: Notifica al Roadmap para que se actualice
      - name: Disparar actualización del Roadmap
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ROADMAP_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ISPC-WEB-2025',
              repo: 'TodoStock-Mobile-RoadMap',
              event_type: 'update-roadmap'
            });